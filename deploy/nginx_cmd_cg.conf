# Nginx Configuration for Mwana Lari SaaS (www.cmd.cg)
server {
    listen 80;
    listen [::]:80;
    server_name www.cmd.cg cmd.cg;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cmd.cg cmd.cg;

    # SSL Certificates (ex: Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/www.cmd.cg/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.cmd.cg/privkey.pem;

    root /var/www/cmd.cg/dist;
    index index.html;

    # Enable Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA Routing: Route all URLs to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio & Static assets caching
    location ~* \.(?:wav|mp3|ogg|js|css|png|jpg|jpeg|gif|ico|svg|woff2|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Service Worker: No-Cache for instant updates
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
