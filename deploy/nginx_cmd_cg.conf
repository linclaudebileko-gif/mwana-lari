# ==============================================================================
# Nginx Configuration & WAF for Mwana Lari SaaS (www.cmd.cg)
# ==============================================================================

# Rate Limiting Zone: 10 requests / second per IP with burst capacity
limit_req_zone $binary_remote_addr zone=mwana_api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mwana_conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name www.cmd.cg cmd.cg;

    # 1. Force HTTPS Redirection
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cmd.cg cmd.cg;

    # SSL Certificates (ex: Let's Encrypt / Certbot / Cloudflare Origin CA)
    # ssl_certificate /etc/letsencrypt/live/www.cmd.cg/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.cmd.cg/privkey.pem;

    root /var/www/cmd.cg/dist;
    index index.html;

    # Connection limit per IP
    limit_conn mwana_conn_limit 20;

    # OWASP & Defense-in-Depth Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://mwana-lari-api.onrender.com http://localhost:8000; img-src 'self' data: https: blob:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # WAF: Block vulnerability scanners & malicious tools
    if ($http_user_agent ~* (sqlmap|nikto|wpscan|dirbuster|gobuster|masscan|acunetix|havij|nmap|zgrab)) {
        return 403;
    }

    # WAF: Block SQL Injection and script injection in query strings
    if ($query_string ~* (union.*select|insert.*into|benchmark\(|waitfor.*delay|<script|javascript:|onerror=)) {
        return 403;
    }

    # Prevent access to hidden files (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # API Proxy with Rate Limiting (if hosted locally or proxied)
    location /api/ {
        limit_req zone=mwana_api_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Routing: Route all frontend URLs to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio & Static assets caching
    location ~* \.(?:wav|mp3|ogg|js|css|png|jpg|jpeg|gif|ico|svg|woff2|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Service Worker: No-Cache for instant updates
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
