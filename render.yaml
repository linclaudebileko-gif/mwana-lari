services:
  # 1. Web Service Backend FastAPI
  - type: web
    name: mwana-lari-api
    env: python
    region: frankfurt # Low latency Europe/Afrique
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mwana-lari-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://www.cmd.cg,https://cmd.cg,https://mwana-lari.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: OPENPAY_BASE_URL
        value: "https://api.openpay-cg.com/v1"
      - key: OPENPAY_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

# 2. Base de Données PostgreSQL Gérée
databases:
  - name: mwana-lari-db
    databaseName: mwana_lari_db
    user: mwana_admin
    region: frankfurt
    plan: free
