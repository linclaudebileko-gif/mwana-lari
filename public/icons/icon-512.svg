<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Sunset Gradient (Amber to Terracotta) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Sun & Light Rays Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Lush Baobab Canopy Gradient -->
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="45%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Trunk Wood Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#542308" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Golden Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadows for 3D Depth -->
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#451a03" flood-opacity="0.45" />
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#451a03" flood-opacity="0.3" />
    </filter>
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Canvas with Premium Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.18" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="12 8" />

  <!-- Inner Warm Savanna Disc (Safe Zone Center) -->
  <circle cx="256" cy="250" r="165" fill="#fdf6e2" filter="url(#shadowLg)" />

  <!-- Radiating Sun of Wisdom behind Baobab -->
  <circle cx="256" cy="180" r="72" fill="url(#sunGrad)" opacity="0.95" />
  
  <!-- Subtle Sun Rays -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <line x1="256" y1="90" x2="256" y2="72" />
    <line x1="320" y1="116" x2="333" y2="103" />
    <line x1="346" y1="180" x2="364" y2="180" />
    <line x1="320" y1="244" x2="333" y2="257" />
    <line x1="192" y1="116" x2="179" y2="103" />
    <line x1="166" y1="180" x2="148" y2="180" />
    <line x1="192" y1="244" x2="179" y2="257" />
  </g>

  <!-- Sacred Baobab Tree -->
  <!-- Lush Green Foliage Canopy -->
  <g filter="url(#shadowSm)">
    <!-- Back Clouds of Leaves -->
    <path d="M185 200 C155 175 165 130 205 125 C220 90 270 85 295 115 C335 110 355 150 330 185 C355 210 330 245 295 235 C275 255 225 250 210 230 C180 235 160 215 185 200 Z" fill="url(#canopyGrad)" />
    <!-- Leaf Clusters Highlight Texture -->
    <circle cx="215" cy="155" r="28" fill="#4ade80" opacity="0.35" />
    <circle cx="295" cy="150" r="30" fill="#4ade80" opacity="0.35" />
    <circle cx="256" cy="125" r="32" fill="#86efac" opacity="0.4" />
  </g>

  <!-- Sturdy Ancient Baobab Trunk & Roots -->
  <g filter="url(#shadowSm)">
    <path d="M232 205 C232 250 205 285 180 305 L332 305 C307 285 280 250 280 205 Z" fill="url(#trunkGrad)" />
    <!-- Bark Texture Grooves -->
    <path d="M246 225 Q244 260 220 295" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
    <path d="M266 220 Q268 260 292 295" stroke="#451a03" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>

  <!-- Mascot Koko / Mwana Emblem Smiling at Center of Tree -->
  <g transform="translate(256, 172)" filter="url(#shadowSm)">
    <!-- Cheerful Owl/Bird Guardian Ears -->
    <path d="M-36 -18 C-48 -45 -24 -48 -14 -24 Z" fill="#ea580c" stroke="#ffffff" stroke-width="2.5" />
    <path d="M36 -18 C48 -45 24 -48 14 -24 Z" fill="#ea580c" stroke="#ffffff" stroke-width="2.5" />
    <!-- Head Base -->
    <circle cx="0" cy="-6" r="26" fill="#fbbf24" stroke="#d97706" stroke-width="2.5" />
    <!-- Traditional Kongo Headband (Green, Yellow, Red) -->
    <path d="M-24 -18 Q0 -25 24 -18" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M-22 -14 Q0 -21 22 -14" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M-20 -10 Q0 -17 20 -10" stroke="#dc2626" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Expressive Eyes -->
    <circle cx="-9" cy="-5" r="4.2" fill="#451a03" />
    <circle cx="9" cy="-5" r="4.2" fill="#451a03" />
    <!-- Eye Highlights -->
    <circle cx="-7.5" cy="-6.5" r="1.5" fill="#ffffff" />
    <circle cx="10.5" cy="-6.5" r="1.5" fill="#ffffff" />
    <!-- Beak / Smiling Mouth -->
    <polygon points="0,-1 -3.5,4 3.5,4" fill="#ea580c" />
    <path d="M-7 7 Q0 13 7 7" fill="none" stroke="#451a03" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Open Golden Book of Roots at the Base -->
  <g transform="translate(256, 335)" filter="url(#shadowLg)">
    <!-- Book Shadow / Spine Base -->
    <ellipse cx="0" cy="18" rx="88" ry="12" fill="#451a03" opacity="0.3" />
    <!-- Left Page -->
    <path d="M-88 -18 Q-42 -30 0 -12 L0 32 Q-42 20 -88 30 Z" fill="url(#pageGrad)" stroke="#d97706" stroke-width="3.5" />
    <!-- Right Page -->
    <path d="M88 -18 Q42 -30 0 -12 L0 32 Q42 20 88 30 Z" fill="url(#pageGrad)" stroke="#d97706" stroke-width="3.5" />
    <!-- Center Binding Spine -->
    <path d="M0 -12 L0 34" stroke="#b45309" stroke-width="4.5" stroke-linecap="round" />
    <!-- Red Ribbon Bookmark -->
    <path d="M0 15 Q-10 32 0 42 Q10 32 0 15" fill="#dc2626" />
    <!-- Golden Knowledge Lines on Left Page -->
    <line x1="-72" y1="-4" x2="-18" y2="0" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-72" y1="10" x2="-18" y2="14" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <!-- Golden Knowledge Lines on Right Page -->
    <line x1="18" y1="0" x2="72" y2="-4" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="18" y1="14" x2="72" y2="10" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Radiating Sparkles / Stars of Wisdom ✨ -->
  <g fill="url(#goldGrad)" filter="url(#glowG)">
    <!-- Top Left Sparkle -->
    <path d="M125 145 Q125 160 110 160 Q125 160 125 175 Q125 160 140 160 Q125 160 125 145 Z" />
    <circle cx="102" cy="180" r="3.5" fill="#fde047" />
    <!-- Top Right Sparkle -->
    <path d="M385 145 Q385 160 370 160 Q385 160 385 175 Q385 160 400 160 Q385 160 385 145 Z" />
    <circle cx="410" cy="180" r="3.5" fill="#fde047" />
    <!-- Bottom Sparkle near Book -->
    <path d="M356 360 Q356 370 346 370 Q356 370 356 380 Q356 370 366 370 Q356 370 356 360 Z" />
  </g>
</svg>
