version: '3.8'

services:
  # 1. Base de données PostgreSQL en ligne / Cloud
  db:
    image: postgres:16-alpine
    container_name: mwana_lari_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mwana_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MwanaLariSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-mwana_lari_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwana_admin -d mwana_lari_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend Cloud FastAPI
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mwana_lari_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mwana_admin:MwanaLariSecure2026!@db:5432/mwana_lari_db
      SECRET_KEY: ${SECRET_KEY:-mwana_lari_super_secret_jwt_key_cg_2026_roots_future}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
    driver: local
